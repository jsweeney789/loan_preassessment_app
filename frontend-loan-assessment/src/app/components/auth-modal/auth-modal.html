<div class="modal-backdrop" (click)="close()">
  <div class="modal" (click)="$event.stopPropagation()">

    <div class="modal-header">
      <span class="modal-eyebrow">Secure Access</span>
      <h2 class="modal-title">{{ activeTab === 'login' ? 'Welcome Back' : 'Create Account' }}</h2>
      <button class="close-btn" (click)="close()">✕</button>
    </div>

    <div class="modal-body">
      <div class="tabs">
        <button [class.active]="activeTab === 'login'" (click)="switchTab('login')">Sign In</button>
        <button [class.active]="activeTab === 'register'" (click)="switchTab('register')">Register</button>
      </div>

      <div class="form">
        <div>
          <label class="field-label">Email</label>
          <input type="email" placeholder="you@example.com" [(ngModel)]="email" name="email" />
        </div>
        <div>
          <label class="field-label">Password</label>
          <input type="password" placeholder="••••••••" [(ngModel)]="password" name="password" />
        </div>

        <div class="error" *ngIf="error">{{ error }}</div>

        <button class="submit-btn" (click)="submit()" [disabled]="loading">
          {{ loading ? 'Please wait...' : (activeTab === 'login' ? 'Sign In' : 'Create Account') }}
        </button>

        <div class="divider"><span>or</span></div>

        <button class="google-btn" (click)="googleLogin()">
          Continue with Google
        </button> 
      </div>
    </div>

  </div>
</div>
