# Requires the AWS Load Balancer Controller to be installed in the cluster.
# One-time setup (run after terraform apply creates the EKS cluster):
#
#   helm repo add eks https://aws.github.io/eks-charts && helm repo update
#   helm install aws-load-balancer-controller eks/aws-load-balancer-controller \
#     -n kube-system \
#     --set clusterName=<environment>-eks-cluster \
#     --set serviceAccount.create=true \
#     --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=<lbc_irsa_role_arn>
#
# The LBC IRSA role ARN is output by the EKS module after terraform apply.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loan-preassessment
  namespace: loan-preassessment
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loan-preassessment
                port:
                  number: 80
